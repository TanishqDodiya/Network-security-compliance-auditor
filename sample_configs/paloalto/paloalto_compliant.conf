# FICTIONAL demo config for hackathon. Not from any real organization.
# Palo Alto-style (set commands). COMPLIANT version.
set deviceconfig system hostname PaloAlto-FW-01
set deviceconfig system dns-setting servers primary 10.0.0.53
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.0.0.10
set deviceconfig system ntp-servers secondary-ntp-server ntp-server-address 10.0.0.11
set deviceconfig setting management hostname-type-in-syslog FQDN
delete deviceconfig system telnet
set deviceconfig system ssh enabled yes
set deviceconfig system web-server https-enabled yes
set deviceconfig system web-server http-enabled no
set deviceconfig system log-settings syslog SYSLOG-01 server 10.0.0.50 port 514
set deviceconfig system snmp-setting v3 users audit-user authpwd S3cure-Demo-Hash privpwd S3cure-Demo-Priv
delete deviceconfig system snmp-setting community public
set shared admin netadmin password-hash "$6$demo$hash"
set shared admin netadmin role superuser
set deviceconfig system password-complexity enabled yes minimum-length 12
set network profiles zone-protection-profile Strict tcp-syn-flood yes
set rulebase security rules Allow-Mgmt-Only source 10.0.0.0/24 action allow
set rulebase security rules Deny-All-Else action deny
