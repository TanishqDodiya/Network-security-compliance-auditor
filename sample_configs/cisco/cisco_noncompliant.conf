! FICTIONAL demo config for hackathon. Not from any real organization.
! Cisco-style. NON-COMPLIANT version: intentionally insecure for demo FAILs.
hostname Cisco-Router-02
!
service telnet
no service password-encryption
service finger
service pad
ip source-route
!
no ip ssh version 2
!
line vty 0 4
 transport input all
 exec-timeout 0 0
 password telnet123
 login
!
ip http server
no ip http secure-server
!
no logging buffered
no logging host
!
no ntp server
!
snmp-server community public RO
snmp-server community private RW
!
username admin password admin123
username guest privilege 15 password guest
enable password cisco
!
no access-list 10
line vty 0 4
 no access-class
!
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
end
