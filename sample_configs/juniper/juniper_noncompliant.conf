# FICTIONAL demo config for hackathon. Not from any real organization.
# Juniper-style (set commands). NON-COMPLIANT version: intentionally insecure.
set system host-name Juniper-Switch-02
set system services telnet
delete system services ssh
set system services web-management http port 80
delete system services web-management https
delete system syslog
delete system ntp
set snmp community public authorization read-only
set snmp community private authorization read-write
set system login user admin class super-user authentication plain-text-password admin123
set system login user guest class super-user authentication plain-text-password guest
set system password minimum-length 4
set system services finger
set security zones security-zone trust host-inbound-traffic system-services all
