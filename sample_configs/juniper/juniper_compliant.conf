# FICTIONAL demo config for hackathon. Not from any real organization.
# Juniper-style (set commands). COMPLIANT version.
set system host-name Juniper-Switch-01
set system services ssh protocol-version v2
set system services ssh connection-limit 5
delete system services telnet
delete system services web-management http
set system services web-management https port 8443
set system syslog host 10.0.0.50 any info
set system syslog file messages any notice
set system ntp server 10.0.0.10
set system ntp server 10.0.0.11
delete snmp community public
set snmp v3 usm local-engine user audit-user authentication-sha authentication-password S3cure-Demo-Hash privacy-aes128 privacy-password S3cure-Demo-Priv
set system login user netadmin class super-user authentication encrypted-password "$6$demo$hash"
set system password minimum-length 12
set system login idle-timeout 10
set security zones security-zone management host-inbound-traffic system-services ssh
set security zones security-zone management host-inbound-traffic system-services https
